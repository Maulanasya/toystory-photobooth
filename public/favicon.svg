<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradasi Lensa Kamera -->
    <radialGradient id="lensShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Gradasi Bodi Hijau Lime Khas Baju Buzz -->
    <linearGradient id="buzzLime" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <!-- Gradasi Ungu Tudung Luar Angkasa Buzz -->
    <linearGradient id="buzzPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Tudung Kepala Ungu Buzz (Bentuk Atap Kamera) -->
  <path d="M 32 20 C 32 12, 68 12, 68 20 L 72 26 L 28 26 Z" fill="url(#buzzPurple)" stroke="#4c1d95" stroke-width="2"/>

  <!-- Tombol Shutter / Laser Merah Khas Buzz di Kiri Atas -->
  <rect x="20" y="16" width="10" height="8" rx="2" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- Flash Kamera di Kanan Atas -->
  <rect x="70" y="16" width="10" height="8" rx="2" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/>

  <!-- Bodi Utama Kamera Putih Armor Luar Angkasa -->
  <rect x="10" y="24" width="80" height="62" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>

  <!-- Plat Aksen Hijau Lime Armor Dada Buzz -->
  <path d="M 12 36 L 88 36 L 88 56 L 12 56 Z" fill="url(#buzzLime)"/>

  <!-- Garis Pemisah Hitam Armor Khas Toy Story -->
  <line x1="10" y1="36" x2="90" y2="36" stroke="#1e293b" stroke-width="2"/>
  <line x1="10" y1="56" x2="90" y2="56" stroke="#1e293b" stroke-width="2"/>

  <!-- Ring Lensa Kamera Luar (Ungu Buzz) -->
  <circle cx="50" cy="55" r="22" fill="url(#buzzPurple)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Lingkaran Tengah Lensa (Cyan / Blue Glass) -->
  <circle cx="50" cy="55" r="16" fill="url(#lensShine)"/>

  <!-- Pantulan Cahaya Lensa Kamera (Glint) -->
  <circle cx="45" cy="50" r="4.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="54" cy="59" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- 3 Tombol Dada Buzz di Sudut Kiri Bawah (Biru, Hijau, Merah) -->
  <circle cx="21" cy="74" r="3.5" fill="#0284c7" stroke="#ffffff" stroke-width="1"/>
  <circle cx="29" cy="74" r="3.5" fill="#22c55e" stroke="#ffffff" stroke-width="1"/>
  <circle cx="37" cy="74" r="3.5" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>

  <!-- Sayap Garis Merah Putih di Sudut Kanan Bawah Kamera -->
  <rect x="68" y="70" width="14" height="7" rx="2" fill="#ef4444"/>
  <line x1="72" y1="70" x2="72" y2="77" stroke="#ffffff" stroke-width="2"/>
  <line x1="77" y1="70" x2="77" y2="77" stroke="#ffffff" stroke-width="2"/>
</svg>
